# smoke_collider_Wp_13TeV.ini  --  a SMALL collider campaign to test an installation: pp 13 TeV, W+ only, resNLO only, Q = 82-87 GeV (3 Q points of the 13 TeV template),
# the full qT and y grids, few shards and a very short VEGAS run.
#
# STATUS: designed from the production example, NOT run yet by the authors (recipes/smoke-test-collider.md). Its wall time is not known; the first real run will tell.
# Use it after scripts/preflight.py has passed. Copy it to local/, then set at least: [paths] dest, [executables], [environment], [scheduler].
#
#   python3 run_process.py local/smoke_collider_Wp_13TeV.ini        # prepare only
#   then the skill review-and-authorize (python3 scripts/campaign_review.py show|approve|submit ...)
#
# Everything else is explained in examples/pp_13TeV_WpWmZ0_CT25NLO.ini.

[paths] source + [templates]      (the W+ files of that template; W-, Z0, ... are derived from them)
#   grids       : <source>/<code>/inp/{q,qt,y}_grid.inp
#   shard tools : [paths] scripts                   (make_shards.py, merge_shards.py, run/submit *_array.sh)
# At prepare time it prints which of these it actually used.

[paths]
source = ../templates/13TeV_WpWm                 # template folder with get_yk_new/ legacy/ resbos/ w_asym/ w_pert/ (wider y grid: 155 points)
dest   = /path/to/your/scratch/smoke13Wp       # SET THIS: a new folder on the cluster
                                            # NEW folder: what a run needs is copied here and every job runs here
scripts = ../scripts                        # shard/merge/validation scripts (default: scripts/ next to run_process.py)
stage_outputs = link                        # how get_yk_new / resbos receive earlier outputs: link (symlinks) or copy (+~1 GB per boson)

[campaign]
mode       = collider                       # collider (this chain) | fixedtarget (see FT_*.ini)
name       = smoke13Wp                      # short: the Fortran codes truncate paths at 100 chars
ecm        = 13000                          # GeV -> written into the w_pert, w_asym and legacy .in files
processes  = W+                              # one boson
pdf        = CT25NLO                        # LHAPDF set; the .in files get "lha_<pdf>"; must be installed on the HPCC
order      = NLO                            # get_yk_new order (NNLO needs real R_Ai tables, see [get_yk_new])
compute    = resNLO                         # resummed piece only (no fixed-order NLO runs)

[executables]                               # where the five programs are taken from (all are checked before anything is copied)
dir        = ../bin                         # <dir>/<code>/<exe>: w_pert/w_pert  w_asym/w_asym  legacy/main  get_yk_new/get_yk_new  resbos/resbos_root
                                            # (made by  ONLY=resbos_legacy sbatch setup.sb ; the binaries inside the templates are never used)
# w_pert     = /path/to/w_pert              # or one key per code; each one wins over dir
# w_asym     = /path/to/w_asym
# legacy     = /path/to/main
# get_yk_new = /path/to/get_yk_new
# resbos     = /path/to/resbos_root

[templates]                                 # .in files, relative to [paths] source (the W+ ones)
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in          # LTO=3  Y piece       -> input of get_yk_new
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in     # LTO=0  main CSS grid -> "Main data grid" of resbos
w_pert      = w_pert/7TeV_w_pert_Wp.in               # fixed-order (Arnold-Reno) piece
w_asym      = w_asym/7TeV_w_asym_Wp.in               # asymptotic piece
resbos      = resbos/7TeV_Wp_resbos.in               # event generator steering; only what [resbos]/[cuts.*] override is changed
# legacy_dsi / legacy_asy (LTO=1 / LTO=2, only for compute = NLO) default to legacy_Y's file; LTO is rewritten anyway

[grids]
active = 1 153 1  1 155 1  10 12 1       # full qT and y grids; Q indices 10-12 = 82, 85, 87 GeV (q_grid.inp)
# Full Q grid (index 80 = 5000 GeV < ECM). The 13 TeV template's y grid has 155 points (not 143).
# w_pert, w_asym and legacy must have identical grids (checked by md5). Q must stay <= ECM: PERTURB aborts otherwise
# (run_process.py checks it before submitting).

[shards]                                    # split along Q only; 1 = a single array task. resbos is never sharded (VEGAS MC)
legacy     = 10
w_pert     = 2
w_asym     = 2

[legacy]                                    # overrides written into the legacy .in files
ibeam   = 1                              # iBeam=-2/-1/0/1: PiN/ppB (ppbar)/pN/pp ; also set in w_pert/w_asym when it is 1 or -1
# fract_n = 0.54d0                          # fraction of neutrons in the nucleus (iBeam=0 only, e.g. Cu)

[get_yk_new]
# Only for order = NNLO (needs real R_Ai tables). With NLO an all-ones R_Ai table is generated (identical result).
# r_ai_Wp = /path/to/R_Ai_wp.txt

[resbos]                                    # keys not given keep the value of the resbos template
runs    = nocuts                            # one resbos job per name, each with its own [cuts.<name>]; w_pert/w_asym/legacy are shared
                                            # (adding a run to a finished campaign: python3 run_process.py THIS.ini --resbos-only --submit)
vegas   = 1,5,3000,5,3000             # iGen, ITMX1, NCALL1, ITMX2, NCALL2: a few 10^4 events, enough to see the chain end to end
# seed    = 182019
# lumi    = 1.0                             # pb^-1
# output  = ROOTNT2

[cuts.nocuts]                               # no cuts: apply them later on the ntuple (extract_tables.py does)
lepton    = 0.0, -10, 0.0, 15000.0, 99.0    # PTECUT, YECUT(-10 = no minimum), DelR, PTNCUT(max), YnCut(max |eta|)
mt_met    = 0.0, 15000., 0.0              # MT min, MT max, ETmiss min

[environment]                               # defaults are the ones of the working example; change for another install
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh

# [scheduler]                               # OPTIONAL, ResbosFlowAgent only. Without it the scripts ask for partition general-long and no account (the author's cluster).
#                                           # Rewrites the #SBATCH header of every generated script. Skill: adapt-scheduler (give it a batch script that works on your cluster).
# partition = <your partition>              # empty value ("partition =") removes the line: the site's default partition
# account   = <your account>
# qos       = <your qos>
# constraint = <your constraint>
# extra     = --mail-type=END; --exclusive  # other sbatch options, "--name=value", separated by ;
# max_time  = 24:00:00                      # ceiling for every --time (a warning lists how many were lowered)
