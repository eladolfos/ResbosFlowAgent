# FT_e605_CT25NLO.ini  --  E605 (E201), p + Cu at 800 GeV, Q^3 dsigma/dQ/dy, 119 points
#
# Legacy iBeam=0, FRACT_N=0.54 (Cu, per nucleon). Measured in y: no dy/dxF Jacobian.
# mode = fixedtarget is Yao's chain, one job per measured (y,Q) point (docs/FIXED_TARGET_WORKFLOW.md):
#   LO      Legacy LTO=-1                                       (1 row per point)
#   NLO     Legacy LTO=3 (P) + LTO=1 (DeltaSigma) on 138 qT values, integrated in qT by Yao's ROOT macro scripts/getnlo/getnlo.C
#           (getnlo_nojac.C for E605; his code, unchanged; needs ROOT in the final job)
#   resNLO  ResBos2 GetFixed (W321 = NNLL+NLO), one run per target on the whole table
# and a final job that writes results/e605_CT25NLO_LO_NLO_W321.txt with LO, NLO, W321 and the K-factors.
#
#   python3 run_process.py Examples/FT_e605_CT25NLO.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py Examples/FT_e605_CT25NLO.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file (Examples/). Everything run_process.py reads is named below:
#   data table      : [fixedtarget] table                 (y in column 1, Q in column 2, data in column 4)
#   Legacy .in      : [paths] source + [fixedtarget] legacy_template     (Yao's LegacyNLO/legacy.in; qT grid = <source>/legacy/inp/qt_grid.inp)
#   GetFixed config : [paths] source + [fixedtarget] resbos2_config      (Yao's fixedtarget.config; only PDF is rewritten)
#   Legacy main     : [executables] dir/legacy_ft/main                   (ONLY=legacy_ft sbatch setup.sb; Legacy with the A0 normalisation override off)
#   GetFixed        : [fixedtarget] getfixed, resbos2_env                (ONLY=resbos2 sbatch setup.sb)
#   final scripts   : [paths] scripts                                    (run_getnlo.sh, getnlo/*.C, make_fixedtarget_tables.py)
# At prepare time it prints which of these it actually used.

[paths]
source = ../templates/FixedTarget           # template folder: legacy/fixedtarget_legacy.in, legacy/inp/qt_grid.inp, resbos2/fixedtarget.config
dest   = /mnt/scratch/lopezels/FixedTarget/FT_e605_CT25NLO
                                            # NEW folder: legacy/<target>/points/pt<N>/ (Legacy), resbos2/<set>/ (GetFixed), results/
scripts = ../scripts                        # default: scripts/ next to run_process.py

[campaign]
mode     = fixedtarget                      # collider | fixedtarget
name     = FT_e605                          # prefix of every job and output (the codes truncate job names at 100 chars)
pdf      = CT25NLO                          # LHAPDF set -> "lha_<pdf>" in the Legacy .in and "PDF = <pdf>" in fixedtarget.config
# ecm    = 38.8                             # GeV; default = the dataset's (below); only override for a custom table
compute  = LO, NLO, resNLO                  # any subset of LO, NLO, resNLO; the final K-factor table needs all three

[executables]
dir      = ../bin                           # Legacy main = <dir>/legacy_ft/main  (built by setup.sb; NOT legacy/main, see below)
# legacy = /path/to/main                    # or an explicit file (wins over legacy_ft). legacy_ft is the same source as legacy with the Type_V = A0 override
#                                           # (CONST=PI*ACOUPL*2/3, 'yfu test 2024.10.13') commented out as in Yao's source; with bin/legacy/main LO and NLO come out ~1250 Q^2 too large

[fixedtarget]
dataset  = e605                             # e605 | e866ppxf | e866f | e906aF -> fixes ECM 38.8 GeV, beam/target, Jacobian, GetFixed name
                                            # one target (p+Cu). 119 points
table    = ../templates/FixTargetTables/e605
                                            # measured points: one row each, y col 1, Q col 2, xF col 3, data col 4 (as GetFixed reads it);
                                            # GetFixed gets this table behind 6 header lines. Any file with that layout works
legacy_template = legacy/fixedtarget_legacy.in   # relative to [paths] source: Yao's LegacyNLO/legacy.in (only ECM, LTO, PDF, iBeam, FRACT_N,
                                            # Type_V=A0 and the single-point grids are patched per piece)
resbos2_config  = resbos2/fixedtarget.config     # relative to [paths] source: Yao's W321 settings (A,B,C = 3,2,1; BLNY; bMax 0.5; scale MT)
getfixed    = ../bin/resbos2/bin/GetFixed        # ResBos2 driver built by  ONLY=resbos2 sbatch setup.sb
resbos2_env = ../bin/resbos2/env_getfixed.sh     # sourced before GetFixed: Yao's libraries, and Yao's PDF folder BEFORE yours in LHAPDF_DATA_PATH
# targets = pp, pd                          # subset of this dataset's targets (one: e605); the ratio sets need both for the final table
# jacobian = none                           # none: Q^3 dsigma/dQ/dy (E605) | mT: dy/dxF inside the integral (E866, E906)
# throttle = 50                             # SLURM array %N (max simultaneous point tasks)
# convgrids = /path/to/ConvGrids            # finished GetFixed ConvGrids for this PDF -> all GetFixed jobs run in parallel.
#                                           # Without it the first GetFixed job generates them and the others wait for it
conda_env = resbosflow                      # conda env with python3 numpy+scipy for the final job (create it once from environment.yml)
# conda_module = Miniforge3/25.11.0-1       # module that provides conda
# final_modules = SciPy-bundle/...          # alternative to conda_env: module giving python3 numpy+scipy (check: module avail SciPy)
# lhapdf_data_path = /path/share/LHAPDF     # force a PDF folder for Legacy and GetFixed (e.g. Yao's pp830a016); default: Legacy uses
#                                           # [environment] lhapdf, GetFixed uses Yao's folder first, then yours

[environment]                               # Legacy jobs (GetFixed uses resbos2_env instead)
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1

# [scheduler]                               # OPTIONAL, ResbosFlowAgent only. Without it the scripts ask for partition general-long and no account (the author's cluster).
#                                           # Rewrites the #SBATCH header of every generated script. Skill: adapt-scheduler (give it a batch script that works on your cluster).
# partition = <your partition>              # empty value ("partition =") removes the line: the site's default partition
# account   = <your account>
# qos       = <your qos>
# constraint = <your constraint>
# extra     = --mail-type=END; --exclusive  # other sbatch options, "--name=value", separated by ;
# max_time  = 24:00:00                      # ceiling for every --time (a warning lists how many were lowered)
