# pp_13TeV_Zgamma_CT25NLO_ResBos2W.ini  --  pp 13TeV Z/gamma* (Zgamma = ZU + ZD), resNLO with the ResBos2 W grid
#
# One chain per boson. resNLO = Legacy chain with the CSS grid W computed by ResBos2 (XSec = Resummation) instead of Legacy's `main`
# (docs/COLLIDER_RESBOS2_W_WORKFLOW.md): the grid removes the Legacy cut W = 0 for qT >= 2Q, which inflates the K-factor at high pT.
# Validated for ZU and ZD, pp 8 TeV (vs Yao's recipe). W+, W-, Z0 and ppbar: not yet run, not yet checked against Legacy grids.
# NLO is unchanged (Legacy). Output names follow KFactor_Raw_simulations (see [output]); the file names of the campaign stay as well.
# CT25NLO, Z/gamma* (Zgamma = ZU + ZD), no cuts, NLO + resNLO (W321) in one campaign, executables built with Legacy ACC_RERR=1e-7.
#
#   python3 run_process.py Examples/pp_13TeV_Zgamma_CT25NLO_ResBos2W.ini            # copy + prepare dest, write dest/submit_all.sh
#   python3 run_process.py Examples/pp_13TeV_Zgamma_CT25NLO_ResBos2W.ini --submit   # ... and submit it (HPCC login node)
#
# Relative paths are relative to THIS file (Examples/). Everything run_process.py reads is named below:
#   executables : [executables] dir/<code>/<exe>   (built by setup.sb into ../bin)
#   .in files   : [paths] source + [templates]      (the W+ files of that template; W-, Z0, ... are derived from them)
#   grids       : <source>/<code>/inp/{q,qt,y}_grid.inp
#   shard tools : [paths] scripts                   (make_shards.py, merge_shards.py, run/submit *_array.sh)
# At prepare time it prints which of these it actually used.

[paths]
source = ../templates/13TeV_WpWm                 # template folder with get_yk_new/ legacy/ resbos/ w_asym/ w_pert/ (wider y grid: 155 points)
dest   = /mnt/scratch/lopezels/KFactorsCT25resNLO/pp_13TeV_Zgamma_CT25NLO_ResBos2W
                                            # NEW folder: what a run needs is copied here and every job runs here
scripts = ../scripts                        # shard/merge/validation scripts (default: scripts/ next to run_process.py)
stage_outputs = link                        # how get_yk_new / resbos receive earlier outputs: link (symlinks) or copy (+~1 GB per boson)

[campaign]
mode       = collider                       # collider (this chain) | fixedtarget (see FT_*.ini)
name       = pp13TeVCT25NLO                         # prefix of every job/file; keep it short (the Fortran codes truncate paths at 100 chars)
ecm        = 13000                          # GeV -> written into the w_pert, w_asym and legacy .in files
processes  = Zgamma                        # one full chain per boson: W+, W-, Z0 (pure Z), A0 (photon), ZU/ZD (Z/gamma*, u-/d-type quarks)
w_grid     = resbos2                        # legacy (default) | resbos2: where the CSS grid of the resNLO comes from
pdf        = CT25NLO                        # LHAPDF set; the .in files get "lha_<pdf>"; must be installed on the HPCC
order      = NLO                            # get_yk_new order (NNLO needs real R_Ai tables, see [get_yk_new])
compute    = resNLO, NLO                    # resNLO = CSS resummed (W321); NLO = fixed order (LTO=1+2+3 slicing); both share legacy_Y

[executables]                               # where the five programs are taken from (all are checked before anything is copied)
dir        = ../bin                         # <dir>/<code>/<exe>: w_pert/w_pert  w_asym/w_asym  legacy/main  get_yk_new/get_yk_new  resbos/resbos_root
                                            # (made by  ONLY=resbos_legacy sbatch setup.sb ; the binaries inside the templates are never used)
# w_pert     = /path/to/w_pert              # or one key per code; each one wins over dir
# w_asym     = /path/to/w_asym
# legacy     = /path/to/main
# get_yk_new = /path/to/get_yk_new
# resbos     = /path/to/resbos_root

[templates]                                 # .in files, relative to [paths] source (the W+ ones)
legacy_Y    = legacy/7TeV_legacy_Wp_W321.in          # LTO=3  Y piece       -> input of get_yk_new
legacy_main = legacy/7TeV_legacy_Wp_W321_main.in     # LTO=0  main CSS grid -> "Main data grid" of resbos
w_pert      = w_pert/7TeV_w_pert_Wp.in               # fixed-order (Arnold-Reno) piece
w_asym      = w_asym/7TeV_w_asym_Wp.in               # asymptotic piece
resbos      = resbos/7TeV_Wp_resbos.in               # event generator steering; only what [resbos]/[cuts.*] override is changed
# legacy_dsi / legacy_asy (LTO=1 / LTO=2, only for compute = NLO) default to legacy_Y's file; LTO is rewritten anyway

[grids]
active = 1 153 1  1 155 1  1 30 1         # qT_min qT_max step   y_min y_max step   Q_min Q_max step: Q index 1-30 = 10-500 GeV
# w_pert, w_asym and legacy must have identical grids (checked by md5). Q must stay <= ECM: PERTURB aborts otherwise
# (run_process.py checks it before submitting).

[shards]                                    # split along Q only; 1 = a single array task. resbos is never sharded (VEGAS MC)
legacy     = 20                          # 4 Legacy passes per boson; the tighter 1e-7 tolerance is slower than the old 1e-4
w_pert     = 5
w_asym     = 5

[legacy]                                    # overrides written into the legacy .in files
ibeam   = 1                              # iBeam=-2/-1/0/1: PiN/ppB (ppbar)/pN/pp ; also set in w_pert/w_asym when it is 1 or -1
# fract_n = 0.54d0                          # fraction of neutrons in the nucleus (iBeam=0 only, e.g. Cu)

[get_yk_new]
# Only for order = NNLO (needs real R_Ai tables). With NLO an all-ones R_Ai table is generated (identical result).
# r_ai_Wp = /path/to/R_Ai_wp.txt

[resbos]                                    # keys not given keep the value of the resbos template
runs    = nocuts                            # one resbos job per name, each with its own [cuts.<name>]; w_pert/w_asym/legacy are shared
                                            # (adding a run to a finished campaign: python3 run_process.py THIS.ini --resbos-only --submit)
vegas   = 1,30,30000,300,100000             # iGen, ITMX1, NCALL1, ITMX2, NCALL2  (~31M events, the default)
# seed    = 182019
# lumi    = 1.0                             # pb^-1
# output  = ROOTNT2

[cuts.nocuts]                               # no cuts: apply them later on the ntuple (extract_tables.py does)
lepton    = 0.0, -10, 0.0, 15000.0, 99.0    # PTECUT, YECUT(-10 = no minimum), DelR, PTNCUT(max), YnCut(max |eta|)
mass_qt_y = 40.0, 200.0, 0.0, 13000.0, -99.0, 99.0     # QMn, QMx, QTMn, QTMx, yWmn, yWmx: generate only 40 < Q < 200 GeV (the Q range of the grid)
mt_met    = 0.0, 15000., 0.0              # MT min, MT max, ETmiss min

[resbos2_w]                                 # ResBos2 W grid of the resNLO (read only with w_grid = resbos2)
# resbos  = ../bin/resbos2/bin/resbos       # ResBos2 executable (default: bin/resbos2/bin/resbos next to run_process.py)
# env     = ../bin/resbos2/env_getfixed.sh  # environment of that build
# config  = ../templates/ResBos2W/resbos_w.config   # electroweak inputs, orders, ...; beam/ECM/Process/PDF/BLNY/qT/Q are set per run
# qtmax   = auto                            # auto = largest qT of the Legacy grid; ResBos2 needs it >= the grid, or resbos_root loses events
# ymax    = 6
# margin  = 2                               # extra Q nodes on each side of the active range
# threads = 4                               # CPUs per ResBos2 run (one run per Q node)
# time    = 02:00:00
# mem     = 8G
# throttle = 32                             # at most N Q nodes at once (sbatch --array=...%N)

[physics]                                   # masses, widths and EW inputs; unset = taken from the templates (below), written to ALL the files that have them
# With w_grid = resbos2 the defaults are: mw mz mh gamw gamz from templates/ResBos2W/resbos_w.config; the quark masses mt mu md ms mc mb from the
# Legacy template. They go to the Legacy .in, resbos.in and the ResBos2 configs, so every piece uses the same values (PHYSICS.txt lists them).
# w_pert/w_asym have built-in masses (M_W = 80.385, M_Z = 91.1875, GF = 1.16637e-5) that no .in changes.
# mt = 172.     mh = 125      gamt = 0      gamh = 0.004          # (gamt, gamh: ResBos2 only)
# mw = 80.385   gamw = 2.108
# mz = 91.1876  gamz = 2.4952
# mu = 0.06983  md = 0.06984  ms = 0.15  mc = 1.3  mb = 4.75     # one key per line in the real file
# gf = 1.1663787e-5   alpha_em0 = 0.00729735   alpha_em_mz = 0.007763340902   ew_mass_scheme = OnShell   # ResBos2 only (one key per line)
# (ResBos2 derives sin^2(theta_W) = 1 - mW^2/mZ^2 from GF, mW, mZ; it has no sinw2 input)

[output]
convention = analysis                       # also hard-link every final .root as for_analysis/<generator>/<beam>_<E>TeV_<PDF>_<PROC>_<CUTS>_<ORDER>.root

[environment]                               # defaults are the ones of the working example; change for another install
modules    = GCC/13.2.0 OpenMPI/4.1.6-GCC-13.2.0 powertools
lhapdf     = /mnt/home/lopezels/InstallSources/LHAPDF
hoppet     = /mnt/home/lopezels/InstallSources/HOPPET1
root_setup = /mnt/home/lopezels/InstallSources/ROOT/bin/thisroot.sh

# [scheduler]                               # OPTIONAL, ResbosFlowAgent only. Without it the scripts ask for partition general-long and no account (the author's cluster).
#                                           # Rewrites the #SBATCH header of every generated script. Skill: adapt-scheduler (give it a batch script that works on your cluster).
# partition = <your partition>              # empty value ("partition =") removes the line: the site's default partition
# account   = <your account>
# qos       = <your qos>
# constraint = <your constraint>
# extra     = --mail-type=END; --exclusive  # other sbatch options, "--name=value", separated by ;
# max_time  = 24:00:00                      # ceiling for every --time (a warning lists how many were lowered)
