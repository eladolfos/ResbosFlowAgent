# Copy to local/remote.conf (git-ignored) and edit. Read by scripts/remote.py.
[remote]
host = msu-dev                 # an alias from YOUR ~/.ssh/config (see docs/REMOTE.md); not user@host
repo = ~/ResbosFlowAgent       # folder on the cluster that holds the toolchain; created by:  python3 scripts/remote.py sync
